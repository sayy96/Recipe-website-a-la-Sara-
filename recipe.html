<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title id="page-title">Recipe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="recipe-detail">
    <a href="index.html" class="back-link">&larr; Back to all recipes</a>

    <img id="recipe-image" class="recipe-photo" src="" alt="">
    <h1 id="recipe-title">Loading...</h1>
    <p id="recipe-tags" class="recipe-tags"></p>

    <h2>Ingredients</h2>
    <ul id="recipe-ingredients"></ul>

    <div class="steps-row">
      <div class="steps-col">
        <h2>Steps</h2>
        <ol id="recipe-steps"></ol>
      </div>

      <aside id="recipe-notes-col" class="recipe-notes-col">
        <h4>Notes &amp; Substitutions</h4>
        <ul id="recipe-notes"></ul>
      </aside>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
